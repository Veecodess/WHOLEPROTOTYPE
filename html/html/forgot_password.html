<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css\css\Casa_Milan.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="/js\js\Login.js" defer></script>
    
</head>
<body>
  <div class="split-layout">
    <!-- Left Column: Login Form -->
    <main class="form-pane">
      <div class="form-container">
        <h1 class="page-title">Forgot Password</h1>
        <p class="page-subtitle">Please enter the email address you'd like your password reset information sent to</p>

        <form action="#" method="POST" autocomplete="off" id="forgotPasswordForm">
          
          <!-- Account Field -->
          <div class="input-group">
            <label for="account">Email</label>
            <input type="email" id="account" name="account" required />
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">Reset Password</button>

          <!-- Footer Options -->
          <div class="form-footer">
            <a href="Login.html" class="back-to-login-link">Back to Login</a>
          </div>

        </form>
      </div>
    </main>
  
    <aside class="image-pane" aria-label="Casa Milan gate photo">

</body>
</html>
