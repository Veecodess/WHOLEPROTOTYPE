<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Schedule | Casa Milan</title>
	<link rel="stylesheet" href="../../css/css/style.css">
</head>
<body class="schedule-page-body">
	<nav>
		<a href="index.html#home" class="logo" aria-label="Casa Milan home">
			<img src="images/logo.png" alt="Casa Milan Homeowner's Association">
			<span>Casa Milan<br>Homeowner's Association</span>
		</a>
		<div class="nav-links">
			<a href="index.html#home">Home</a>
			<a href="index.html#about">About</a>
			<a href="index.html#events">Announcements</a>
			<a href="index.html#amenities">Amenities</a>
			<a href="contacts.html">Contact</a>
			<a href="index.html#login">Log In</a>
		</div>
	</nav>

	<main class="schedule-page">
		<header class="schedule-header">
			<a class="schedule-header-back" href="reservation.html" aria-label="Back to guest information">&#8592;</a>
			<div>
				<h1>Schedule</h1>
				<p>Select Date &amp; Time</p>
			</div>
		</header>

		<section class="schedule-calendar" aria-labelledby="calendar-title">
			<div class="schedule-month-controls">
				<button id="previous-month" class="month-button" type="button" aria-label="Previous month">&#8249;</button>
				<h2 id="calendar-title"></h2>
				<button id="next-month" class="month-button" type="button" aria-label="Next month">&#8250;</button>
			</div>
			<div class="calendar-weekdays" aria-hidden="true">
				<span>Sun</span>
				<span>Mon</span>
				<span>Tue</span>
				<span>Wed</span>
				<span>Thu</span>
				<span>Fri</span>
				<span>Sat</span>
			</div>
			<div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Reservation dates"></div>
		</section>

		<form id="schedule-form" class="schedule-form" action="guestpayment.html" method="get">
			<input id="amenity-name" name="Amenity" type="hidden">
			<input id="venue-type" name="Venue Type" type="hidden">
			<input id="last-name" name="Last Name" type="hidden">
			<input id="first-name" name="First Name" type="hidden">
			<input id="middle-name" name="Middle Name" type="hidden">
			<input id="contact-number" name="Contact Number" type="hidden">
			<input id="email" name="Email Address" type="hidden">
			<input id="reservation-date" name="Reservation Date" type="hidden" required>
			<input id="reservation-time" name="Reservation Time" type="hidden" required>

			<label class="duration-field" for="duration">
				<span class="sr-only">Reservation duration</span>
				<select id="duration" name="Duration">
					<option value="1">1 hour</option>
					<option value="2">2 hours</option>
					<option value="3">3 hours</option>
				</select>
			</label>

			<div id="time-slots" class="time-slots" aria-label="Available reservation times"></div>

			<div class="schedule-legend" aria-label="Schedule legend">
				<strong>Legend:</strong>
				<span class="legend-available">Green - Available</span>
				<span class="legend-booked">Gray - Fully Booked / Not Available</span>
				<span class="legend-maintenance">Red - Amenity Maintenance</span>
				<span class="legend-today">Blue - Date Today</span>
			</div>

			<div class="schedule-actions">
				<a class="schedule-back-button" href="reservation.html">Back</a>
				<button class="schedule-next-button" type="submit">Next</button>
			</div>
		</form>
	</main>

	<script>
		const query = new URLSearchParams(window.location.search);
		const today = new Date();
		const monthLabel = document.getElementById('calendar-title');
		const calendarGrid = document.getElementById('calendar-grid');
		const timeSlots = document.getElementById('time-slots');
		const reservationDate = document.getElementById('reservation-date');
		const reservationTime = document.getElementById('reservation-time');
		const scheduleForm = document.getElementById('schedule-form');
		let displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);

		const times = [
			{ label: '7:00 AM - 8:00 AM', value: '07:00', status: 'maintenance' },
			{ label: '9:00 AM - 10:00 AM', value: '09:00', status: 'maintenance' },
			{ label: '11:00 AM - 12:00 PM', value: '11:00', status: 'available' },
			{ label: '1:00 PM - 2:00 PM', value: '13:00', status: 'available' },
			{ label: '3:00 PM - 4:00 PM', value: '15:00', status: 'maintenance' },
			{ label: '5:00 PM - 6:00 PM', value: '17:00', status: 'maintenance' },
			{ label: '7:00 PM - 8:00 PM', value: '19:00', status: 'available' },
			{ label: '9:00 PM - 10:00 PM', value: '21:00', status: 'maintenance' }
		];

		const setReservationDetails = () => {
			const fields = ['amenity-name', 'venue-type', 'last-name', 'first-name', 'middle-name', 'contact-number', 'email'];
			const names = ['Amenity', 'Venue Type', 'Last Name', 'First Name', 'Middle Name', 'Contact Number', 'Email Address'];
			fields.forEach((field, index) => {
				document.getElementById(field).value = query.get(names[index]) || '';
			});
		};

		const isSameDate = (firstDate, secondDate) => firstDate.toDateString() === secondDate.toDateString();

		const renderTimeSlots = () => {
			timeSlots.replaceChildren();
			times.forEach((time) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = `time-slot time-slot-${time.status}`;
				button.textContent = time.label;
				button.disabled = time.status !== 'available';
				button.addEventListener('click', () => {
					document.querySelectorAll('.time-slot-selected').forEach((slot) => slot.classList.remove('time-slot-selected'));
					button.classList.add('time-slot-selected');
					reservationTime.value = time.value;
				});
				timeSlots.appendChild(button);
			});
		};

		const renderCalendar = () => {
			const year = displayedMonth.getFullYear();
			const month = displayedMonth.getMonth();
			const firstDay = new Date(year, month, 1).getDay();
			const daysInMonth = new Date(year, month + 1, 0).getDate();
			monthLabel.textContent = displayedMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
			calendarGrid.replaceChildren();

			for (let index = 0; index < firstDay; index += 1) {
				calendarGrid.appendChild(document.createElement('span'));
			}

			for (let day = 1; day <= daysInMonth; day += 1) {
				const date = new Date(year, month, day);
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'calendar-day';
				button.textContent = day;
				button.setAttribute('aria-label', date.toLocaleDateString('en-US', { dateStyle: 'long' }));

				if (date < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
					button.disabled = true;
					button.classList.add('calendar-day-past');
				} else if (isSameDate(date, today)) {
					button.classList.add('calendar-day-today');
				}

				if (reservationDate.value === `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`) {
					button.classList.add('calendar-day-selected');
				}

				button.addEventListener('click', () => {
					document.querySelectorAll('.calendar-day-selected').forEach((selectedDay) => selectedDay.classList.remove('calendar-day-selected'));
					button.classList.add('calendar-day-selected');
					reservationDate.value = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
				});
				calendarGrid.appendChild(button);
			}
		};

		document.getElementById('previous-month').addEventListener('click', () => {
			const currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
			if (displayedMonth > currentMonth) {
				displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() - 1, 1);
				renderCalendar();
			}
		});
		document.getElementById('next-month').addEventListener('click', () => {
			displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
			renderCalendar();
		});

		scheduleForm.addEventListener('submit', (event) => {
			if (!reservationDate.value || !reservationTime.value) {
				event.preventDefault();
				window.alert('Please select a date and an available time before continuing.');
			}
		});

		setReservationDetails();
		renderCalendar();
		renderTimeSlots();

		document.querySelector('nav').addEventListener('click', (event) => {
			const link = event.target.closest('a');
			if (!link) return;
			if (!window.confirm('Leave reservation? Your progress will be lost, and your reservation will not be completed.')) {
				event.preventDefault();
			}
		});
	</script>
</body>
</html>
